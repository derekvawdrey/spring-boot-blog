services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: derek
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derek -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blog
      SPRING_DATASOURCE_USERNAME: derek
      SPRING_DATASOURCE_PASSWORD: blog
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
